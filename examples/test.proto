// Test file for Protocol Buffers syntax highlighting
syntax = "proto3";

package example.test;

import "google/protobuf/timestamp.proto";
import public "common/types.proto";

/*
 * User message definition
 * Contains user information
 */
message User {
  // Unique user identifier
  string id = 1;
  string name = 2;
  int32 age = 3;
  repeated string tags = 4;
  map<string, string> metadata = 5;

  // Nested address message
  message Address {
    string street = 1;
    string city = 2;
    int32 postal_code = 3;
  }

  Address address = 6;
  Status status = 7;
}

// User status enumeration
enum Status {
  STATUS_UNKNOWN = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_SUSPENDED = 3;
}

// User management service
service UserService {
  // Get a single user
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // List users with streaming response
  rpc ListUsers(ListUsersRequest) returns (stream User);

  // Create user with streaming request
  rpc CreateUsers(stream CreateUserRequest) returns (CreateUsersResponse);

  // Bidirectional streaming
  rpc Chat(stream ChatMessage) returns (stream ChatMessage);
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
  bool found = 2;
}

message ListUsersRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message CreateUserRequest {
  User user = 1;
}

message CreateUsersResponse {
  repeated User users = 1;
  int32 created_count = 2;
}

message ChatMessage {
  string user_id = 1;
  string message = 2;
  int64 timestamp = 3;
}

// Test various data types
message DataTypes {
  double double_field = 1;
  float float_field = 2;
  int32 int32_field = 3;
  int64 int64_field = 4;
  uint32 uint32_field = 5;
  uint64 uint64_field = 6;
  sint32 sint32_field = 7;
  sint64 sint64_field = 8;
  fixed32 fixed32_field = 9;
  fixed64 fixed64_field = 10;
  sfixed32 sfixed32_field = 11;
  sfixed64 sfixed64_field = 12;
  bool bool_field = 13;
  string string_field = 14;
  bytes bytes_field = 15;
}

// Test field modifiers
message FieldModifiers {
  optional string optional_field = 1;
  repeated string repeated_field = 2;
  map<string, int32> map_field = 3;

  oneof test_oneof {
    string name = 4;
    int32 id = 5;
  }
}

// Test reserved fields
message ReservedFields {
  reserved 2, 15, 9 to 11;
  reserved "foo", "bar";

  string active_field = 1;
}
